services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hms_finance_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-hms-prod-key
      - ALLOWED_HOSTS=*
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hms_finance_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
