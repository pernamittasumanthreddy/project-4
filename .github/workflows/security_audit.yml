name: Security Audit & Zero-Key Enforcement

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    name: HIPAA Guardrails & Secret Leak Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Zero Hardcoded Private Keys or Paid Secrets
        run: |
          echo "Auditing codebase for unauthorized proprietary vendor API keys..."
          ! grep -rn "sk_live_" .
          ! grep -rn "twilio_auth_token" .
          ! grep -rn "agora_app_id" .
          echo "Zero proprietary keys found. 100% compliant local execution verified."
